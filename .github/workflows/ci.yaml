# Calls the shared workflow (truvity/ci-workflows), which runs each named
# Justfile recipe as its OWN parallel job under devbox. Pinned by commit SHA,
# never a tag — tags move, and this runs across the estate.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@49248a6cebd3720ac7f2eaf2e98ec97c0967b3b6 # v2.17.0
    with:
      recipes: '["build","test","lint","chart-lint","ts"]'

  # Stable name for branch protection: the matrix reports as "recipes / build"
  # etc., so a required context called "check" would never arrive on its own.
  check:
    needs: recipes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.recipes.result }}" = "success" ]'
