# Tag-triggered release — the shared implementation (truvity/ci-workflows).
# A `v*` tag publishes the Helm chart to oci://ghcr.io/truvity/charts and,
# because this is also a Go module, that same tag is the module version
# consumers `go get`. The caller grants the permissions because a reusable
# workflow can narrow them but never widen them. Pinned by commit SHA.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish — a half-pushed artifact set is worse than
# a queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@49248a6cebd3720ac7f2eaf2e98ec97c0967b3b6 # v2.17.0
    with:
      charts: '["gateway-auth"]'
