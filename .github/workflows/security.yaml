name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  # The same recipe the shared workflow runs everywhere else. Deliberately
  # NOT in ci.yaml's recipe list, and deliberately not a required context:
  # a standard-library advisory with no released fix would otherwise wedge
  # every pull request on a finding nobody can act on.
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@eb317bdb3240d43404665cc943d1c00e8946f733 # v2.18.0
    with:
      recipes: '["vuln"]'
