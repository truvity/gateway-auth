# gateway-auth — browser-auth exposure for a UI in the "oauth2-proxy shape"
# (INF-562). One oauth2-proxy per OIDC client, per-install Valkey sessions,
# and — per protected route — an Envoy extAuth SecurityPolicy, so no app
# hand-rolls its own SecurityPolicy. See README.md for the two usage modes.

# Cluster the exposure lands on (used in the default OIDCApp spec.name).
clusterName: devel

# Extra annotations merged into every resource (alongside the ArgoCD
# sync-wave ordering annotations this chart sets itself).
commonAnnotations: {}

# Extra annotations for the oauth2-proxy pod template.
podAnnotations: {}

exposure:
  # Master switch. Nothing renders unless this is true.
  enabled: false

  # Base name every resource derives from (OIDCApp, ValkeyCluster, cookie
  # Secret, oauth2-proxy workload, HTTPRoutes, SecurityPolicies). Must be
  # unique per install in the namespace — one oauth2-proxy per OIDC client.
  # Defaults to the release name.
  name: ""

  # The public hostname the OIDCApp redirect URIs are minted for and every
  # HTTPRoute matches. REQUIRED when enabled.
  hostname: ""

  # OIDC issuer (Zitadel instance). REQUIRED when enabled.
  # e.g. https://auth.truvity.xyz
  issuer: ""

  # Path prefix the proxy owns (sign_in, start, callback, sign-out). The
  # HTTPRoute to the proxy and the OIDCApp redirectUri use it. eudi-style
  # shared-host installs override to e.g. "/_gwauth".
  proxyPrefix: "/oauth2"

  # Cluster DNS suffix used to build the Valkey service FQDN.
  dnsDomain: cluster.local

  # Cookie/redirect domain allow-list for oauth2-proxy. Empty → the single
  # exposure host. Set to a leading-dot parent (".devel.truvity.xyz") to
  # share one session cookie across subdomains.
  cookieDomains: []

  # When true the proxy also forwards the token in the standard
  # Authorization: Bearer header (url-shortener /api/me needs it in addition
  # to X-Auth-Request-Access-Token).
  passAuthorizationHeader: false

  # Parent Gateway/listener the HTTPRoutes attach to. REQUIRED when enabled.
  gateway:
    name: ""
    namespace: ""
    sectionName: ""

  # Zitadel identity. project selects HOW the OIDCApp binds to a project:
  #   project.cluster: true  → projectId (shared cluster-{env} project, the
  #                            gateways-stack shape). Set identity.projectId.
  #   project.cluster: false → projectRef.name = project.ref (an install's
  #                            own product Project CR, the url-shortener /
  #                            eudi shape).
  identity:
    # mode selects WHERE the client credential comes from.
    #   zitadel (default) - this chart renders an OIDCApp and the Zitadel
    #                       operator mints the client Secret. Unchanged.
    #   static            - no OIDCApp is rendered; the credential is read
    #                       from identity.existingSecret, which must carry the
    #                       keys client-id and client-secret. Use this to front
    #                       a provider that has no operator and no CR to
    #                       reconcile (dex, Keycloak, a hand-registered client).
    mode: zitadel
    # Required when mode is static. Keys: client-id, client-secret.
    existingSecret: ""
    # Overrides the JWKS URI on the SecurityPolicy. Zitadel serves its keys at
    # {issuer}/oauth/v2/keys and nothing else does, so a non-Zitadel provider
    # must set this (dex serves {issuer}/keys).
    jwksUri: ""
    # Overrides the OAuth scopes oauth2-proxy requests, as a space-separated
    # string. Empty -> "openid profile email", plus "groups" when
    # authorization.groups is non-empty, because the jwt authorization rule
    # reads that claim out of the access token and a provider only sends a
    # claim it was asked for. Set this only for a provider that names the
    # claim differently or requires an extra scope of its own.
    scopes: ""
    project:
      cluster: true
      ref: ""
    projectId: ""
    # OIDCApp spec.name (the Zitadel app display name). Empty → {name}-{cluster}.
    appName: ""

  # Routes on the exposure host. protected entries get an extAuth
  # SecurityPolicy. Unlisted paths (eudi wallet/issuer/Hydra) get NO
  # SecurityPolicy — anonymous by construction. Each entry:
  #   name             HTTPRoute/SecurityPolicy suffix (DNS label)
  #   path             match value (default "/")
  #   pathType         PathPrefix | Exact (default PathPrefix)
  #   protected        render a SecurityPolicy (bool)
  #   authenticatedOnly  ext_authz is the whole gate — any org user who logs
  #                    in passes, the token is still forwarded, and NO
  #                    jwt/groups block is emitted (the app authorizes itself;
  #                    the business-app posture). authorization.groups is then
  #                    not required for the route.
  #   backend          optional {name, port} override of exposure.backend
  #   targetRouteName  ATTACH MODE — bind the SecurityPolicy to this EXISTING
  #                    HTTPRoute (owned elsewhere, e.g. a ring3 app chart)
  #                    instead of creating one here. When set, this chart
  #                    renders NO app HTTPRoute/backend for the entry (only
  #                    the SecurityPolicy); backend/path/pathType are ignored.
  #                    The {proxyPrefix} proxy route stays chart-owned.
  routes:
    - name: app
      path: /
      protected: true

  # Session sharing. Left empty, each install generates its own cookie secret
  # and runs its own Valkey - independent sessions, one login per host. Set
  # BOTH of these plus a common exposure.cookieDomains to make several
  # installs one sign-on: oauth2-proxy derives the cookie key from the
  # secret, so proxies sharing it read each other's cookies, and a shared
  # store means they see each other's sessions.
  cookie:
    # Secret carrying OAUTH2_PROXY_COOKIE_SECRET. Empty -> generated per
    # install by the ESO Password generator.
    existingSecret: ""
  sessionStore:
    # redis:// URL of a shared store. Empty -> this install gets its own
    # ValkeyCluster, as before.
    url: ""

  # Session lifetime and renewal.
  #
  # ON SIGNING OUT, and read this before building a logout button. The proxy
  # serves <proxyPrefix>/sign_out (SignOutURL in this repo builds the link),
  # and it clears THIS proxy's cookie and its stored session. It does not,
  # and cannot, end the session at the identity provider.
  #
  # What the user experiences therefore depends entirely on the provider:
  #
  #   - a provider implementing RP-Initiated Logout (an end_session_endpoint
  #     in its discovery document) can be sent a redirect that ends its
  #     session too, and sign-out behaves the way people expect;
  #   - a provider WITHOUT one leaves its own session, or its upstream
  #     connector's, untouched. The next request 302s straight back through
  #     it and the user is silently signed in again, having pressed a button
  #     that appeared to do something. dex is in this category: it
  #     advertises no end_session_endpoint and no front- or back-channel
  #     logout, and it re-runs its connector on every authorize, so what
  #     keeps the user signed in is the UPSTREAM provider's cookie.
  #
  # That is not a bug in this chart and no value here fixes it. Check the
  # provider's discovery document before offering the button.
  session:
    # Cookie lifetime. The default sits under a 12h access token; see the
    # long note in _exposure.tpl for why that matters when refresh is off.
    expire: "11h"
    # Renew the access token once the cookie is older than this. Empty ->
    # no refresh, which is what every install did before this existed.
    #
    # MUST be shorter than expire, or the cookie dies before a refresh is
    # ever attempted and the setting does nothing while looking correct.
    # That one is on you: Helm cannot compare two duration strings, so it
    # is documented rather than enforced.
    #
    # Setting it also adds offline_access to the requested scopes, without
    # which the provider issues no refresh token and refresh cannot work.
    # Combining it with an explicit identity.scopes that omits
    # offline_access is refused at render time rather than left to fail
    # silently at runtime.
    refresh: ""

  # jwt groups allow-list values for protected routes (defaultAction Deny).
  authorization:
    groups: []

  # Default app Service protected routes forward to (overridable per route).
  backend:
    name: ""
    port: 80

  # oauth2-proxy workload.
  proxy:
    image:
      # Override to the cluster's ECR mirror in gitops, e.g.
      # <acct>.dkr.ecr.<region>.amazonaws.com/quay/oauth2-proxy/oauth2-proxy
      repository: quay.io/oauth2-proxy/oauth2-proxy
      tag: v7.15.4
    replicas: 2
    # Empty → requests cpu 25m/memory 64Mi, limits memory 128Mi.
    resources: {}
    # Scheduling passthroughs (empty by default; the gateways-stack pins
    # arm64 — set these to reproduce that).
    nodeSelector: {}
    tolerations: []
    topologySpreadConstraints: []

  # Per-install session store. The valkey.io operator owns the pods and the
  # headless Service valkey-{name}-sessions:6379 — this chart makes no
  # Service/Secret of its own.
  valkey:
    shards: 1
    replicas: 0
    image: ""
    persistence:
      enabled: false
      size: 1Gi
      storageClassName: ""
      reclaimPolicy: Delete
    resources: {}
    config: {}
    users: []
    exporter:
      enabled: false

  # Ingress-from-fleet NetworkPolicy: admit the shared Envoy data-plane to
  # the proxy's ext_authz port.
  networkPolicy:
    enabled: true
    port: 4180
    fleetNamespace: envoy-gateway-system
    # Namespace the valkey-operator runs in. A second NetworkPolicy admits it
    # to the session ValkeyCluster pods on 6379/16379 so it can form the shard
    # and mark the cluster Ready — REQUIRED in a business-app namespace whose
    # default-deny tenant baseline admits only cnpg/envoy/tailscale
    # cross-namespace (platform namespaces lack that baseline).
    valkeyOperatorNamespace: valkey-operator-system
